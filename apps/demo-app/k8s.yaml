apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: demo-app, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: demo-app } }
  template:
    metadata: { labels: { app: demo-app } }
    spec:
      containers:
        - name: demo-app
          image: demo-app:1.0
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 5000 }]
          env: [{ name: ERROR_RATE, value: "0.02" }]
---
apiVersion: v1
kind: Service
metadata: { name: demo-app, namespace: demo, labels: { app: demo-app } }
spec:
  selector: { app: demo-app }
  ports: [{ name: http, port: 5000, targetPort: http }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: demo-app, namespace: demo, labels: { release: kps } }
spec:
  selector: { matchLabels: { app: demo-app } }
  endpoints: [{ port: http, interval: 15s }]
